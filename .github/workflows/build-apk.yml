name: Build Android APK (Force Bypass)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد الجافا
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. إعداد أداة Gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. بناء الـ APK مع إجبار أندرويد على تخطي توقيع الأخطاء (Debug Key)
    - name: Build Unsigned APK
      run: gradle assembleDebug -Pandroid.packageBuildConfig=false --no-daemon

    # 5. خطوة التوقيع التلقائي السحابي لتجنب نقص ملف الـ Keystore
    - name: Sign APK (Cloud-based)
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/debug
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
      continue-on-error: true

    # 6. رفع ملف الـ APK النهائي
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ALthemar-App
        path: "/build/outputs/apk//*.apk"
