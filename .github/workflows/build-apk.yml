name: Build Android APK (Final Fix)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد بيئة الجافا
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. حل مشكلة الملف المفقود: توليد ملف keystore تجريبي في المسار المطلوب فوراً
    - name: Generate Dummy Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        # نسخ الملف إلى المجلد الرئيسي ومجلد التطبيق لضمان تلبية أي مسار مشفر بالكود
        cp debug.keystore app/debug.keystore || true

    # 4. إعداد أداة Gradle سحابياً
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 5. تشغيل أمر البناء مع إيقاف المهام المتداخلة لأدوات الـ IDE والـ KSP
    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.project.ksp.incremental=false || gradle assembleDebug --no-daemon -Dorg.gradle.project.ksp.incremental=false

    # 6. رفع ملف الـ APK النهائي الناتج لتنزيله
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ALthemar-App-Debug
        path: "**/build/outputs/apk/debug/*.apk"
