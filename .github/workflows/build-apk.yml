name: Build Android APK (Robust)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من مشروعك
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد إصدار متوافق من الجافا (Java 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. إعداد أداة البناء Gradle سحابياً بشكل كامل (لحل مشكلة الملفات الناقصة)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. تشغيل أمر بناء الـ APK مباشرة
    - name: Build APK with Gradle
      run: gradle assembleRelease --no-daemon

    # 5. البحث عن ملف الـ APK ورفعه لتنزيله
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: "**/build/outputs/apk/release/*.apk"
