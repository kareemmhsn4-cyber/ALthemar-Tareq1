name: Build Android APK (Native)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. إعداد الجافا (مهمة جداً للأندرويد)
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. إعطاء صلاحية تشغيل ملف البناء لـ Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. الأمر الفعلي لبناء ملف الـ APK
    - name: Build with Gradle
      run: ./gradlew assembleRelease

    # 5. رفع ملف الـ APK الناتج لتتمكن من تحميله
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
